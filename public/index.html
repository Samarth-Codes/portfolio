    <meta charset="utf-8" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EQVDHT8S18"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      var GA_MEASUREMENT_ID = 'G-EQVDHT8S18';

      function trackPageView() {
        gtag('event', 'page_view', {
          page_path: window.location.pathname + window.location.search + window.location.hash,
          page_location: window.location.href,
          page_title: document.title
        });
      }

      gtag('js', new Date());
      gtag('config', GA_MEASUREMENT_ID, { send_page_view: false });
      trackPageView();

      (function(history) {
        var originalPushState = history.pushState;
        var originalReplaceState = history.replaceState;

        history.pushState = function() {
          var result = originalPushState.apply(history, arguments);
          trackPageView();
          return result;
        };

        history.replaceState = function() {
          var result = originalReplaceState.apply(history, arguments);
          trackPageView();
          return result;
        };
      })(window.history);

      window.addEventListener('popstate', trackPageView);
    </script>

    <script>
      // Block MetaMask connection attempts
      Object.defineProperty(window, 'ethereum', {
        get: function() {
          console.warn('MetaMask connection blocked');
          return undefined;
        },
        set: function() {
          console.warn('MetaMask connection blocked');

      // Block any attempts to access ethereum provider
